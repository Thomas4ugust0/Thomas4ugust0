name: Generate Datas
on:
  schedule:
    - cron: "* */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: thomas4ugust0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%233D74FF&color_dots=%23ebedf0,%238cb4ff,%235882fa,%231d4ed8,%23172554
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%233D74FF&color_dots=%23161b22,%231e3a8a,%232563eb,%233d74ff,%2360a5fa
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
