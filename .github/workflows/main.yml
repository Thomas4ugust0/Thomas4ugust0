name: Generate Datas
on:
  schedule: 
    - cron: "* */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: thomas4ugust0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3D74FF&color_dots=#ebedf0,#8cb4ff,#5882fa,#1d4ed8,#172554
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#3D74FF&color_dots=#161b22,#1e3a8a,#2563eb,#3d74ff,#60a5fa
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
