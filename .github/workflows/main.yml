name: Generate Datas
on:
  schedule:
    - cron: "* */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: thomas4ugust0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1b49aa&color_dots=#ebedf0,#b6ceff,#6da0f3,#3c76dc,#1b49aa
            dist/github-contribution-grid-snake-dark.svg?color_snake=#3c76dc&color_dots=#161b22,#203a70,#345da6,#4a82db,#75a7f7
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
